<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>BETONWERK · Soon</title>
<meta name="description" content="BETONWERK. Soon.">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: almost silent; one word
   IDEA: a blank sheet with the cube drawn on it
   PICTURE: the stippled cube, centred, large
   COLOUR and TYPE: pure white, black ink; Archivo
   LAYOUT: one column, cube, SOON, field */
:root{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:#fff;color:#111;font:16px/1.5 Archivo,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:clip}
main{flex:1;width:min(100%,420px);padding:clamp(24px,8vh,80px) 24px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
img{width:min(78vw,340px);height:auto;display:block;margin-bottom:clamp(16px,4vh,36px)}
h1{font-weight:800;font-size:clamp(34px,9vw,44px);letter-spacing:.18em;margin:0 0 18px;padding-left:.18em;line-height:1}
form{width:100%;display:flex;gap:6px;align-items:center;justify-content:center}
input{flex:1;max-width:240px;font:13px/1 Tahoma,"MS Sans Serif",Geneva,Verdana,sans-serif;color:#000;background:#fff;padding:3px 4px;height:24px;border:2px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px 0 #404040,inset -1px -1px 0 #dfdfdf;border-radius:0;outline:none;-webkit-appearance:none;appearance:none}
input::placeholder{color:#808080}
button{flex:none;font:13px/1 Tahoma,"MS Sans Serif",Geneva,Verdana,sans-serif;color:#000;background:#c0c0c0;height:24px;min-width:75px;padding:0 10px;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px 0 #808080,inset 1px 1px 0 #dfdfdf;border-radius:0;cursor:pointer;-webkit-appearance:none;appearance:none}
button:active{border-color:#404040 #fff #fff #404040;box-shadow:inset 1px 1px 0 #808080;padding:2px 9px 0 11px}
button:focus-visible{outline:1px dotted #000;outline-offset:-5px}
input:focus-visible{outline:1px dotted #000;outline-offset:2px}
.fine{font-size:13px;color:#777;margin:12px 0 0;line-height:1.45}
.fine u{text-underline-offset:2px}
.err{font-size:13px;color:#a12a1c;min-height:20px;margin-top:8px}
.done{display:none;font-size:16px}
.done.on{display:block}
footer{font-size:13px;color:#999;padding:16px 24px calc(16px + env(safe-area-inset-bottom));text-align:center}
@media(prefers-reduced-motion:no-preference){.done.on{animation:f .5s ease}@keyframes f{from{opacity:0}}}
</style>
</head>
